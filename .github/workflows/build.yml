name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

jobs:
  prepare_release:
    name: prepare release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release shell
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
              --repo "$GITHUB_REPOSITORY" --title "SAMT Desktop ${GITHUB_REF_NAME}" \
              --notes "Automated macOS arm64 and Windows x64 research build."

  build:
    needs: prepare_release
    if: always() && (needs.prepare_release.result == 'success' || needs.prepare_release.result == 'skipped')
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: SAMT-Desktop-macOS-arm64
          - os: windows-2025
            artifact: SAMT-Desktop-Windows-x64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download fold checkpoints from release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download checkpoints-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern "SAMT-checkpoints.zip" --output "$RUNNER_TEMP/ckpt.zip"
          # The archive stores paths relative to the repo root (app/models/...,
          # app/core/...), so extract at the checkout root.
          python - <<'PY'
          import zipfile, os
          with zipfile.ZipFile(os.path.join(os.environ["RUNNER_TEMP"], "ckpt.zip")) as z:
              z.extractall(".")
          PY
          ls app/models/*.pth | wc -l
          test -f app/core/samt_core/Networks/resnet_18_23dataset.pth

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.3" "scipy<1.17" "pandas<3" "scikit-image<0.26" "matplotlib<3.11" "PySide6<6.13"
          pip install torch==2.3.0 torchvision==0.18.0 monai==1.3.0 SimpleITK==2.5.6 pretrainedmodels pydicom tensorboardX scikit-learn openpyxl six pyinstaller pytest

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.3" "scipy<1.17" "pandas<3" "scikit-image<0.26" "matplotlib<3.11" "PySide6<6.13"
          pip install torch==2.3.0 torchvision==0.18.0 monai==1.3.0 SimpleITK==2.5.6 pretrainedmodels pydicom tensorboardX scikit-learn openpyxl six pyinstaller pytest

      - name: Run tests
        run: python -m pytest tests -x -q

      - name: Build lossless checkpoint store
        shell: bash
        run: |
          python scripts/build_checkpoint_store.py
          python scripts/verify_checkpoint_store.py
          mkdir -p "$RUNNER_TEMP/raw-checkpoints"
          mv app/models/pathology_pretrain_fold*_*.pth "$RUNNER_TEMP/raw-checkpoints/"
          test -f app/models/samt-checkpoints.zip

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller packaging/samt-desktop-macos.spec --noconfirm

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller packaging/samt-desktop-windows.spec --noconfirm

      - name: Stage artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          test -d SAMT-Desktop.app/Contents/MacOS
          test -f SAMT-Desktop.app/Contents/Info.plist
          hdiutil create -volname "SAMT Desktop" \
            -srcfolder SAMT-Desktop.app -ov -format UDZO \
            SAMT-Desktop-macOS-arm64.dmg
          ditto -c -k --keepParent SAMT-Desktop.app \
            SAMT-Desktop-macOS-arm64-app.zip

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/SAMT-Desktop -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Publish macOS disk image
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f dist/SAMT-Desktop-macOS-arm64.dmg
          gh release upload "${GITHUB_REF_NAME}" \
            dist/SAMT-Desktop-macOS-arm64.dmg \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish Windows archive
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          archive="${{ matrix.artifact }}.zip"
          test -f "$archive"
          mkdir -p release-assets
          size="$(stat -c%s "$archive")"
          if [ "$size" -lt 2147483648 ]; then
            cp "$archive" "release-assets/$archive"
          else
            split -b 1500M -d -a 2 "$archive" "release-assets/$archive.part"
          fi
          cat > release-assets/README-ASSETS.txt <<'TXT'
          SAMT Desktop release assets

          Files ending in .partNN are 1500 MiB split parts of one ZIP archive.
          Rejoin them before unzipping.

          macOS / Linux:
            cat SAMT-Desktop-Windows-x64.zip.part* > SAMT-Desktop-Windows-x64.zip

          Windows PowerShell:
            $parts = Get-ChildItem -File SAMT-Desktop-Windows-x64.zip.part* | Sort-Object Name
            $out = [System.IO.File]::Create('SAMT-Desktop-Windows-x64.zip')
            foreach ($part in $parts) {
              $in = [System.IO.File]::OpenRead($part.FullName)
              $in.CopyTo($out)
              $in.Dispose()
            }
            $out.Dispose()
          TXT
          gh release upload "${GITHUB_REF_NAME}" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --clobber

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" --title "SAMT Desktop ${GITHUB_REF_NAME}"
