name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: SAMT-Desktop-macOS-arm64
          - os: windows-2025
            artifact: SAMT-Desktop-Windows-x64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download fold checkpoints from release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download checkpoints-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern "SAMT-checkpoints.zip" --output "$RUNNER_TEMP/ckpt.zip"
          # The archive stores paths relative to the repo root (app/models/...,
          # app/core/...), so extract at the checkout root.
          python - <<'PY'
          import zipfile, os
          with zipfile.ZipFile(os.path.join(os.environ["RUNNER_TEMP"], "ckpt.zip")) as z:
              z.extractall(".")
          PY
          ls app/models/*.pth | wc -l
          test -f app/core/samt_core/Networks/resnet_18_23dataset.pth

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.3.0 torchvision==0.18.0
          pip install monai==1.3.0 SimpleITK==2.5.6 pandas scikit-image scipy pretrainedmodels pydicom matplotlib tensorboardX scikit-learn openpyxl six PySide6 pyinstaller pytest

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.3.0 torchvision==0.18.0
          pip install monai==1.3.0 SimpleITK==2.5.6 pandas scikit-image scipy pretrainedmodels pydicom matplotlib tensorboardX scikit-learn openpyxl six PySide6 pyinstaller pytest

      - name: Run tests
        run: python -m pytest tests -x -q

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller packaging/samt-desktop-macos.spec --noconfirm

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller packaging/samt-desktop-windows.spec --noconfirm

      - name: Stage artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent SAMT-Desktop ${{ matrix.artifact }}.zip

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/SAMT-Desktop -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Split oversized release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f -name '*.zip' -print0 | while IFS= read -r -d '' src; do
            name="$(basename "$src")"
            size="$(stat -c%s "$src")"
            if [ "$size" -lt 2147483648 ]; then
              cp "$src" "release-assets/$name"
              echo "single: $name ($size bytes)"
            else
              split -b 1500M -d -a 2 "$src" "release-assets/$name.part"
              echo "split: $name ($size bytes)"
              ls -lh "release-assets/$name.part"*
            fi
          done
          cat > release-assets/README-ASSETS.txt <<'TXT'
          SAMT Desktop release assets

          Files ending in .partNN are 1500 MiB split parts of one ZIP archive.
          Rejoin them before unzipping.

          macOS / Linux:
            cat SAMT-Desktop-Windows-x64.zip.part* > SAMT-Desktop-Windows-x64.zip

          Windows PowerShell:
            $parts = Get-ChildItem -File SAMT-Desktop-Windows-x64.zip.part* | Sort-Object Name
            $out = [System.IO.File]::Create('SAMT-Desktop-Windows-x64.zip')
            foreach ($part in $parts) {
              $in = [System.IO.File]::OpenRead($part.FullName)
              $in.CopyTo($out)
              $in.Dispose()
            }
            $out.Dispose()
          TXT

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
